[package]
name = "kario-native"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Native modules of Kario's TypeScript apps in Rust (kario_native.h, 22-developer-api.md 9.3)"
