id = "qwerty-v1"
name = "全键盘 v1"
form = "qwerty"
chip = "tca8418"
address = 0x34
rows = 8
cols = 8

# Matrix position "row,col" -> key (keys.toml). Shift, Fn and Sym each have
# a row of their own (row 7), so a modifier and any other key never ghost
# (52-hardware-architecture.md).
[matrix]
"0,0" = "q"
"0,1" = "w"
"0,2" = "e"
"0,3" = "r"
"0,4" = "t"
"0,5" = "y"
"0,6" = "u"
"0,7" = "i"
"1,0" = "o"
"1,1" = "p"
"1,2" = "a"
"1,3" = "s"
"1,4" = "d"
"1,5" = "f"
"1,6" = "g"
"1,7" = "h"
"2,0" = "j"
"2,1" = "k"
"2,2" = "l"
"2,3" = "z"
"2,4" = "x"
"2,5" = "c"
"2,6" = "v"
"2,7" = "b"
"3,0" = "n"
"3,1" = "m"
"3,2" = "comma"
"3,3" = "dot"
"3,4" = "space"
"3,5" = "clear"
"3,6" = "ok"
"4,0" = "soft-left"
"4,1" = "soft-right"
"4,2" = "call"
"4,3" = "end"
"4,4" = "back"
"5,0" = "up"
"5,1" = "down"
"5,2" = "left"
"5,3" = "right"
"6,0" = "ime"
"7,0" = "shift"
"7,1" = "fn"
"7,2" = "sym"

# The second legend on the keycaps, typed with Fn held (sku.json carries it
# to the renderer): the digits on the left block, laid out as on a phone
# pad, the symbols around them. A draft until the keycaps are designed.
[fn]
q = "#"
w = "1"
e = "2"
r = "3"
t = "("
y = ")"
u = "_"
i = "-"
o = "+"
p = "@"
a = "*"
s = "4"
d = "5"
f = "6"
g = "/"
h = ":"
j = ";"
k = "'"
l = "\""
z = "7"
x = "8"
c = "9"
v = "?"
b = "!"
n = "&"
m = "%"
dot = "0"
