"0,1" = "up"
"0,2" = "soft-right"
"0,3" = "call"
"0,4" = "end"
"1,0" = "left"
"1,1" = "ok"
"1,2" = "right"
"1,3" = "clear"
"1,4" = "back"
"2,0" = "1"
"2,1" = "2"
"2,2" = "3"
"2,3" = "down"
"3,0" = "4"
"3,1" = "5"
"3,2" = "6"
"3,3" = "7"
"3,4" = "8"
"4,0" = "9"
"4,1" = "star"
"4,2" = "0"
"4,3" = "pound"
