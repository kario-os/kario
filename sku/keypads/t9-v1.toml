id = "t9-v1"
name = "九宫格键盘 v1"
form = "t9"
chip = "tca8418"
address = 0x34
rows = 5
cols = 5

# Matrix position "row,col" -> key (keys.toml). The layout follows the
# keyboard board's schematic; this one is the first draft.
