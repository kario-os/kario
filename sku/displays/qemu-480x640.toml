id = "qemu-480x640"
name = "QEMU 虚拟屏 480×640（竖屏）"
# QEMU's virtio-gpu display, sized on QEMU's command line.
virtual = true
width = 480
height = 640
# QEMU's virtio multitouch device (QEMU 8.1 on) over the same display: the
# selftest's touchscreen step and the GUI run touch it through QMP
# (yocto/qemu-buttons.py, yocto/qemu-gui-drive.py); the emulator's kernel
# drives it with its virtio_input module (phone-qemuarm64.yml).
touchscreen = "virtio-multitouch-pci"
