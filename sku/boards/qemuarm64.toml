id = "qemuarm64"
name = "QEMU 虚拟机（开发）"
machine = "qemuarm64"
# Its display and keyboard are QEMU's (virtio-gpu, USB keyboard).
virtual = true
modem = "sim"
gpu = false

# The fingerprint sensor (hal/fingerprint): simulated, for the lock-screen
# and payment cases. Real boards leave it out until their sensor has a
# driver (keystored then has none).
fingerprint = "sim"
# The NFC controller (phone-nfcd): simulated readers and cards. Boards with
# an NCI controller say nci:/dev/<node>; boards without NFC leave it out.
nfc = "sim"
# The location receiver (location/): a named pipe in the Shell's run
# directory, which the selftest writes NMEA into, so the emulator reads
# position through the same parser as a phone's receiver.
gnss = "fifo:gnss.nmea"

# QEMU's RTC (pl031) can be set: setting the time writes it, and the
# kernel sets the clock from it at boot.
[rtc]
read_only = false

# A USB host of its own (QEMU's xHCI, where the keyboard is and where the
# selftest plugs keyboards and mice), beside dummy_hcd's computer.
[usb]
host = true
vbus_ma = 500

# The notification light (hal/led): QEMU has none, so the image makes a
# userspace LED of this name (uleds) for the shell to blink.
[leds]
notify = "white:status"

# The A/B disk (phone-ab.wks.in, 25-system-update.md §1): phone-initramfs
# keeps the slot in the state partition, QEMU passes the kernel itself.
[partitions]
layout = "ab"
slots = "state"
part = [
    { name = "state", role = "state" },
    { name = "rootfs", ab = true, role = "root" },
    { name = "data", role = "data" },
]

# The devices the kernel makes for the emulator (the virtual bus), which
# the line's hardware test checks on QEMU (40-testing.md §10): two Wi-Fi
# radios (mac80211_hwsim), the Bluetooth controllers btvirt makes over
# hci_vhci (only while it runs: the selftest's), the test-pattern camera
# (vivid) and the sound card QEMU gives with -device virtio-sound-pci.
[[part]]
kind = "wifi"
name = "mac80211_hwsim radios"
bus = "virtual"
driver = "drivers/net/wireless/virtual/mac80211_hwsim.c"

[[part]]
kind = "bluetooth"
name = "btvirt's controllers (hci_vhci)"
bus = "virtual"
driver = "drivers/bluetooth/hci_vhci.c"

[[part]]
kind = "camera"
name = "vivid"
bus = "virtual"
facing = "back"
driver = "drivers/media/test-drivers/vivid/vivid-core.c"

[[part]]
kind = "sound-card"
name = "virtio-sound"
bus = "virtual"
driver = "sound/virtio/virtio_card.c"
