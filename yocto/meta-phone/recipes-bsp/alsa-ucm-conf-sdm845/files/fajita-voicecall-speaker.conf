
# Kario's addition to the OnePlus 6T's Voice Call verb, appended by
# alsa-ucm-conf-sdm845: the speaker, for phone-audiod's call routing. The
# verb above routes the call to the earpiece only. The TFA9894 speaker
# amplifier is on QUAT_MI2S_RX (MultiMedia3 in HiFi.conf), and the Poco
# F1's Voice Call verb (Xiaomi/beryllium: the same SoC and kernel) sends
# the call there with the same mixer control. Speaker1, not Speaker: HiFi
# has a Speaker, and PulseAudio 17 fails on one device name in two verbs.
# No ConflictingDevice: phone-audiod enables this before it disables the
# Earpiece. Not tried on a phone.

SectionDevice."Speaker1" {
	Comment "Speaker"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia3' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia3' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2" # MultiMedia3
	}
}
