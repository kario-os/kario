# Kario's changes to q6voiced's unit (39-oneplus-6t.md §14.20).
[Unit]
# Requires= alone does not order: q6voiced came up before the bus.
After=dbus.service ModemManager.service
# Never given up for good: RestartSec grows to RestartMaxDelaySec instead.
StartLimitIntervalSec=0

[Service]
# As a DynamicUser= service q6voiced had its bus connection dropped by
# dbus-daemon ("Did not receive a reply") at every start on the 6T, which
# dbus-broker took on other systems: it runs as its own system user, in
# the audio group for the sound card.
DynamicUser=no
User=q6voiced
Group=audio
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
ExecStart=
ExecStart=/usr/libexec/q6voiced/q6voiced-wait hw:${q6voice_card},${q6voice_device}
RestartSec=2
RestartSteps=5
RestartMaxDelaySec=60
