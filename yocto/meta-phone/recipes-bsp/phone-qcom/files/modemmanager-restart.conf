# ModemManager restarted whenever it fails, not only when it crashes, and
# never given up for good (39-oneplus-6t.md §14.20): telephonyd and
# q6voiced wait on the bus for it to come back.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
RestartSteps=5
RestartMaxDelaySec=60
