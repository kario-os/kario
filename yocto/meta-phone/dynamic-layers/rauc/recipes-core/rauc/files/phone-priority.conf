# RAUC writes a system update at a low priority (25-system-update.md §6):
# the phone stays responsive while an update installs in the background, and
# an incremental bundle's applier, a child of its hook, runs the same way.
# Nice and CPUWeight act on any kernel; the I/O class is best-effort at the
# lowest priority rather than idle, which steady foreground I/O (a video
# being recorded) could starve forever; IOWeight needs BFQ or io.cost.
[Service]
Nice=10
CPUWeight=20
IOSchedulingClass=best-effort
IOSchedulingPriority=7
IOWeight=20
