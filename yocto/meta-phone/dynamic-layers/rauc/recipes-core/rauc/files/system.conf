# RAUC for the phone (R37): two system slots by GPT partition name, written
# raw (a slot image is ext4 plus its dm-verity hash tree); the slot choice
# lives in the state partition, which phone-initramfs reads at boot
# (phone-ota's rauc-boot is the boot loader backend).
[system]
compatible=@COMPATIBLE@
bootloader=custom
data-directory=/var/lib/slots/rauc

[handlers]
bootloader-custom-backend=/usr/lib/phone/rauc-boot

[keyring]
path=/usr/lib/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=raw
bootname=a

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=raw
bootname=b
