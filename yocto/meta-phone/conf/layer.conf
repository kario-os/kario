BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Appends to other layers' recipes, used only when that layer is in the build.
BBFILES_DYNAMIC += "webkit:${LAYERDIR}/dynamic-layers/webkit/recipes-*/*/*.bbappend \
                    rauc:${LAYERDIR}/dynamic-layers/rauc/recipes-*/*/*.bb \
                    rauc:${LAYERDIR}/dynamic-layers/rauc/recipes-*/*/*.bbappend \
                    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "phone"
BBFILE_PATTERN_phone = "^${LAYERDIR}/"
BBFILE_PRIORITY_phone = "10"

LAYERDEPENDS_phone = "core"
LAYERSERIES_COMPAT_phone = "wrynose"

# The Go sources live two levels above the layer (the kario tree); resolved at parse
# time so the path is correct both on the host and inside kas-container.
PHONE_FW_SRCDIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..', '..'))}"
