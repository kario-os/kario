#@TYPE: Machine
#@NAME: OnePlus 6T (fajita, Snapdragon 845)
#@DESCRIPTION: The OnePlus 6T on the sdm845-mainline kernel: its stock bootloader loads an Android boot image from boot_a/boot_b, the root file system is the userdata partition (39-oneplus-6t.md). The SKU oneplus-fajita describes it to the shell.

# Kryo 385: Cortex-A75 and Cortex-A55 derived cores (Armv8.2-A).
DEFAULTTUNE ?= "cortexa75-cortexa55"
require conf/machine/include/arm/armv8-2a/tune-cortexa75-cortexa55.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-sdm845"
KERNEL_IMAGETYPE = "Image.gz"
KERNEL_DEVICETREE = "qcom/sdm845-oneplus-fajita.dtb"

# The boot image (phone-bootimg) at the offsets and page size of Nura's
# deviceinfo for the phone. root= in the image's own command line is what
# makes the bootloader add neither its system partition as root= nor
# "skip_initramfs ro init=/init"; the kernel then mounts userdata itself.
# console=ttyMSM0 is Nura's: besides the debug UART it avoids a race in the
# display's probe (gitlab.freedesktop.org/drm/msm/-/issues/46). phone.gui=1
# starts the shell on the panel (phone-display.service).
PHONE_BOOTIMG_PAGESIZE = "4096"
PHONE_BOOTIMG_BASE = "0x00000000"
PHONE_BOOTIMG_KERNEL_OFFSET = "0x00008000"
PHONE_BOOTIMG_RAMDISK_OFFSET = "0x01000000"
PHONE_BOOTIMG_SECOND_OFFSET = "0x00f00000"
PHONE_BOOTIMG_TAGS_OFFSET = "0x00000100"
PHONE_BOOTIMG_CMDLINE = "root=PARTLABEL=userdata rootfstype=ext4 rootwait rw console=ttyMSM0,115200 phone.gui=1${PHONE_BRINGUP_CMDLINE}"

# Bring-up (phone-bringup): a console and SSH over the USB cable, the
# previous boot's kernel log kept, no suspend while it is held; and the
# kernel's and systemd's messages on the panel until the shell draws.
# PHONE_BRINGUP = "0" builds the image without them.
PHONE_BRINGUP ??= "1"
PHONE_BRINGUP_CMDLINE = "${@' console=tty0' if d.getVar('PHONE_BRINGUP') == '1' else ''}"

# No getty on the debug UART: it is only reachable through test points.
SERIAL_CONSOLES = ""

# USB is device only in the mainline device tree (dr_mode "peripheral").
MACHINE_FEATURES = "alsa bluetooth ext2 keyboard screen usbgadget wifi"

# userdata: ext4 with 4 KiB blocks (the UFS has 4 KiB sectors), and its
# Android sparse form for fastboot (phone-sparse), in which a run of zeros
# takes 4 bytes. It grows to the partition at the first boot
# (PHONE_ROOT_FSTAB).
IMAGE_CLASSES += "phone-sparse"
IMAGE_FSTYPES = "ext4 ext4.sparse"
EXTRA_IMAGECMD:ext4:append = " -b 4096"
PHONE_ROOT_FSTAB = "/dev/root / auto defaults,x-systemd.growfs 1 1"

# The sound card's q6voice PCM, which q6voiced opens during calls (Nura's
# q6voiced.conf for the 6T). phone-audiod sets the card up through its UCM
# profile (phone-qcom-audio): for media the HiFi verb, whose Speaker
# routes MultiMedia3 (hw:0,2) to the TFA9894 amplifier; during a call the
# Voice Call verb with the bottom microphone and the earpiece
# (MultiMedia1, hw:0,0) or the speaker (Speaker1, Kario's addition to the
# profile in alsa-ucm-conf-sdm845). The 6T has no headphone jack.
Q6VOICED_PCM = "hw:0,6"
PHONE_AUDIO_UCM_CARD = "hw:0"
PHONE_AUDIO_UCM_VERB = "HiFi"
PHONE_AUDIO_UCM_DEVICE = "Speaker"
PHONE_AUDIO_PCM = "plughw:0,2"
PHONE_AUDIO_UCM_CALL_VERB = "Voice Call"
PHONE_AUDIO_UCM_EARPIECE = "Earpiece"
PHONE_AUDIO_EARPIECE_PCM = "plughw:0,0"
PHONE_AUDIO_UCM_CALL_SPEAKER = "Speaker1"
PHONE_AUDIO_CALL_SPEAKER_PCM = "plughw:0,2"
PHONE_AUDIO_UCM_CALL_MIC = "Mic"

# The phone's hardware: modules and firmware, the Qualcomm services the
# modem needs (QRTR tools, rmtfs, tqftpserv), ModemManager, the sound
# card's UCM profile and call audio, the SoC glue (phone-qcom), Wi-Fi's
# regulatory database.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
    kernel-modules \
    firmware-oneplus-sdm845 \
    qrtr rmtfs tqftpserv \
    modemmanager libqmi \
    alsa-ucm-conf-sdm845 alsa-utils-alsaucm alsa-utils-amixer q6voiced \
    phone-qcom-uim phone-qcom-btaddr phone-qcom-abslot phone-qcom-audio \
    wireless-regdb-static \
    ${@'phone-bringup' if d.getVar('PHONE_BRINGUP') == '1' else ''} \
"
