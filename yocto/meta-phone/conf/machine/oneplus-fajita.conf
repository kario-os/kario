#@TYPE: Machine
#@NAME: OnePlus 6T (fajita, Snapdragon 845)
#@DESCRIPTION: The OnePlus 6T on the sdm845-mainline kernel: its stock bootloader loads an Android boot image from boot_a/boot_b, whose initramfs mounts the root file system, the userdata partition (39-oneplus-6t.md). The SKU oneplus-fajita describes it to the shell.

# Kryo 385: Cortex-A75 and Cortex-A55 derived cores (Armv8.2-A).
DEFAULTTUNE ?= "cortexa75-cortexa55"
require conf/machine/include/arm/armv8-2a/tune-cortexa75-cortexa55.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-sdm845"
KERNEL_IMAGETYPE = "Image.gz"
KERNEL_DEVICETREE = "qcom/sdm845-oneplus-fajita.dtb"

# The boot image (phone-bootimg) at the offsets and page size of Nura's
# deviceinfo for the phone, with phone-initramfs, which mounts userdata
# by its partition name whatever the command line says: OnePlus's ABL
# appends root=PARTUUID=<Android's system partition> after the image's own
# command line in any case (seen on a 6T, 39-oneplus-6t.md §1). With a
# root= in the image's line ABL leaves out "skip_initramfs rootwait ro
# init=/init" and androidboot.slot_suffix, so root= stays, though nothing
# reads it (phone-abslot then takes the slot marked active); rootfstype,
# rootwait and rw were for a kernel mounting the root itself.
# console=ttyMSM0 is Nura's: besides the debug UART it avoids a race in the
# display's probe (gitlab.freedesktop.org/drm/msm/-/issues/46). phone.gui=1
# starts the shell on the panel (phone-display.service).
PHONE_BOOTIMG_PAGESIZE = "4096"
PHONE_BOOTIMG_BASE = "0x00000000"
PHONE_BOOTIMG_KERNEL_OFFSET = "0x00008000"
PHONE_BOOTIMG_RAMDISK_OFFSET = "0x01000000"
PHONE_BOOTIMG_SECOND_OFFSET = "0x00f00000"
PHONE_BOOTIMG_TAGS_OFFSET = "0x00000100"
PHONE_BOOTIMG_CMDLINE = "root=PARTLABEL=userdata console=ttyMSM0,115200 phone.gui=1${PHONE_BOOT_LOG_CMDLINE}"

# The layout (43-phone-partitions.md): "userdata", the root file system is
# all of userdata, which phone-initramfs mounts read-write; "ab", it is in
# system_a and system_b, phone-initramfs mounts the slot ABL started
# through dm-verity, and RAUC updates the other (phone-fajita-ab.yml sets
# it; not tried on a phone). Both boot images carry the initramfs; root=
# is only there for ABL (the A/B one names the verified root the
# initramfs makes), phone.layout=ab tells the system and fajita-flash.sh
# which layout it is.
PHONE_LAYOUT ??= "userdata"
PHONE_ABBOOT_CMDLINE = "root=/dev/dm-0 console=ttyMSM0,115200 phone.gui=1 phone.layout=ab${PHONE_BOOT_LOG_CMDLINE}"

# The panel shows no kernel or systemd message and no cursor, from the
# bootloader's picture (simplefb keeps it, and fbcon, deferred by
# phone-console.cfg, draws nothing until text reaches a VT) to the Shell's
# boot animation. PHONE_BOOT_LOG = "1" (kas: yocto/kas/boot-log.yml)
# writes the kernel's and systemd's messages on the panel (console=tty0)
# until the Shell draws; the UART, pstore and the journal have them either way.
PHONE_BOOT_LOG ??= "0"
PHONE_BOOT_LOG_CMDLINE = "${@' console=tty0' if d.getVar('PHONE_BOOT_LOG') == '1' else ' vt.global_cursor_default=0'}"

# Bring-up (phone-bringup): a console and SSH over the USB cable, the
# previous boot's kernel log kept, no suspend while it is held.
# PHONE_BRINGUP = "0" builds the image without them.
PHONE_BRINGUP ??= "1"

# No getty on the debug UART: it is only reachable through test points.
SERIAL_CONSOLES = ""

# USB is device only in the mainline device tree (dr_mode "peripheral").
MACHINE_FEATURES = "alsa bluetooth ext2 keyboard screen usbgadget wifi"

# userdata: ext4 with 4 KiB blocks (the UFS has 4 KiB sectors), and its
# Android sparse form for fastboot (phone-sparse), in which a run of zeros
# takes 4 bytes. It grows to the partition at the first boot
# (PHONE_ROOT_FSTAB). In the A/B layout: the root slot image (ext4 and its
# hash tree, phone-verity) in sparse form for system_a and system_b, and
# the A/B boot image; the initramfs mounts the root read-only, so no "/"
# line, which systemd would remount read-write.
IMAGE_CLASSES += "phone-sparse"
IMAGE_FSTYPES = "${@'ext4 ext4.verity ext4.verity.sparse abboot' if d.getVar('PHONE_LAYOUT') == 'ab' else 'ext4 ext4.sparse'}"
EXTRA_IMAGECMD:ext4:append = " -b 4096"
PHONE_ROOT_FSTAB = "${@'' if d.getVar('PHONE_LAYOUT') == 'ab' else '/dev/root / auto defaults,x-systemd.growfs 1 1'}"

# The sound card's q6voice PCM, which q6voiced opens during calls (Nura's
# q6voiced.conf for the 6T). phone-audiod sets the card up through its UCM
# profile (phone-qcom-audio): for media the HiFi verb, whose Speaker
# routes MultiMedia3 (hw:0,2) to the TFA9894 amplifier; during a call the
# Voice Call verb with the bottom microphone and the earpiece
# (MultiMedia1, hw:0,0) or the speaker (Speaker1, Kario's addition to the
# profile in alsa-ucm-conf-sdm845). The 6T has no headphone jack. The
# PHONE_AUDIO_* are the board file's [audio] (sku/boards/oneplus-fajita.toml),
# which phone-shell and tools/phone-chroot read: tools/sku.py check refuses
# a difference.
Q6VOICED_PCM = "hw:0,6"
PHONE_AUDIO_UCM_CARD = "hw:0"
PHONE_AUDIO_UCM_VERB = "HiFi"
PHONE_AUDIO_UCM_DEVICE = "Speaker"
PHONE_AUDIO_PCM = "plughw:0,2"
PHONE_AUDIO_UCM_CALL_VERB = "Voice Call"
PHONE_AUDIO_UCM_EARPIECE = "Earpiece"
PHONE_AUDIO_EARPIECE_PCM = "plughw:0,0"
PHONE_AUDIO_UCM_CALL_SPEAKER = "Speaker1"
PHONE_AUDIO_CALL_SPEAKER_PCM = "plughw:0,2"
PHONE_AUDIO_UCM_CALL_MIC = "Mic"

# The modem's IMS (VoLTE), for a SKU whose board has ims = "81voltd"
# (tools/sku.py writes PHONE_IMS into the SKU's kas overlay): 81voltd opens
# the bearers the modem asks for, phone-qcom-pdc activates the modem's
# configuration for the SIM's carrier.
PHONE_IMS ??= ""
PHONE_IMS_PACKAGES = "${@'81voltd phone-qcom-pdc' if d.getVar('PHONE_IMS') == '81voltd' else ''}"

# The phone's hardware: modules and firmware, the Qualcomm services the
# modem needs (QRTR tools, rmtfs, tqftpserv), ModemManager, the sound
# card's UCM profile and call audio, the SoC glue (phone-qcom; with
# phone-qcom-wake the modem's calls and messages wake the phone), Wi-Fi's
# regulatory database; and the root file system's /init (base-files-init).
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
    base-files-init \
    kernel-modules \
    firmware-oneplus-sdm845 \
    qrtr rmtfs tqftpserv \
    modemmanager libqmi \
    ${PHONE_IMS_PACKAGES} \
    alsa-ucm-conf-sdm845 alsa-utils-alsaucm alsa-utils-amixer q6voiced \
    phone-qcom-uim phone-qcom-btaddr phone-qcom-abslot phone-qcom-audio phone-qcom-wake phone-qcom-charger \
    wireless-regdb-static \
    ${@'phone-bringup' if d.getVar('PHONE_BRINGUP') == '1' else ''} \
"
