#@TYPE: Machine
#@NAME: Kario on Qualcomm SM6115 / SM4250 boards (mainline Linux)
#@DESCRIPTION: One machine for the Snapdragon 662 / 460 boards of 24-sku-framework.md: one kernel with every board's device tree; a SKU picks its board's tree and applies its display and keypad (phone-sku).

# Snapdragon 662 / 460 have A73 + A53 / A53 cores. Packages built for
# qemuarm64's tune (armv8.0 + CRC, scheduled for the A57) run on them
# unchanged and come from the same shared state cache; a product build
# switches to tune-cortexa73-cortexa53.
require conf/machine/include/arm/armv8a/tune-cortexa57.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
KERNEL_IMAGETYPE = "Image.gz"
KERNEL_DEVICETREE = "qcom/sm6115-fxtec-pro1x.dtb qcom/sm4250-oneplus-billie2.dtb"
# Symbols in the trees, for the SKU overlays.
KERNEL_DTC_FLAGS = "-@"

SERIAL_CONSOLES = "115200;ttyMSM0"
MACHINE_FEATURES = "alsa bluetooth ext2 keyboard screen usbgadget usbhost vfat wifi"
IMAGE_FSTYPES = "ext4 tar.zst"
