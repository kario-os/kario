# Memory pressure (PSI): the shell's low-memory killer reads it, and the
# low-memory stress test reports it.
CONFIG_PSI=y
# The notification light (hal/led): the LED class, multicolor LEDs (a
# phone's RGB status LED) and the timer trigger of the slow blink, which
# the LED controller runs by itself when its driver can.
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_CLASS_MULTICOLOR=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_TIMER=y
# The panel's backlight (hal/backlight).
CONFIG_BACKLIGHT_CLASS_DEVICE=y
