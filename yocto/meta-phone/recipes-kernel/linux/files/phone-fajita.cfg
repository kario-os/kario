# The OnePlus 6T's kernel (machine oneplus-fajita, linux-sdm845) starts from
# Nura's sdm845 configuration; this adds what Kario's image needs and keeps
# what the phone needs from changing under it (linux-sdm845 checks every
# option here).

# No initramfs: the kernel mounts userdata (UFS, GPT, ext4) itself, so
# everything on the way to it is built in.
CONFIG_SCSI_UFSHCD=y
CONFIG_SCSI_UFSHCD_PLATFORM=y
CONFIG_SCSI_UFS_QCOM=y
CONFIG_PHY_QCOM_QMP_UFS=y
CONFIG_BLK_DEV_SD=y
CONFIG_EFI_PARTITION=y
CONFIG_EXT4_FS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
# The A/B layout's boot image carries phone-initramfs (gzip), which mounts
# the root slot through dm-verity (43-phone-partitions.md).
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y

# Modules uncompressed, as the image's kmod loads them; under lockdown
# only those signed with the build directory's key load (phone-lockdown.cfg),
# so the boot image and userdata come from the same build directory. The
# release without a git suffix, as the module directory is named.
# CONFIG_MODULE_COMPRESS is not set
# CONFIG_LOCALVERSION_AUTO is not set

# Nura lists Landlock in CONFIG_LSM without building it; the app sandbox
# needs it (phone-qcom.cfg turns it on).
CONFIG_SECURITY_LANDLOCK=y

# The previous boot's kernel log in the device tree's ramoops region, read
# after a reboot without a serial port (phone-bringup).
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_PMSG=y

# A wake lock held while bringing the phone up keeps it, and its USB
# console, out of suspend (phone-bringup).
CONFIG_PM_WAKELOCKS=y

# The panel through the display controller (dumb buffers, page flips): the
# 6T's Samsung S6E3FC2X01, the 6's SOFEF00; the power key (PM8998 PON) and
# the volume keys (gpio-keys); phone-paint reads keys through evdev.
CONFIG_DRM_MSM=y
CONFIG_DRM_PANEL_SAMSUNG_S6E3FC2X01=y
CONFIG_DRM_PANEL_SAMSUNG_SOFEF00=y
CONFIG_INPUT_PM8941_PWRKEY=y
CONFIG_KEYBOARD_GPIO=y
CONFIG_INPUT_EVDEV=y

# The touchscreen (Synaptics S3706 on I2C 12, the device tree's
# syna,rmi4-i2c, reporting through its 2D sensor function F12): built in,
# not Nura's modules, so that phone-paint has it from the start and no
# module of it needs loading under lockdown (tools/sku.py checks the
# board's touchscreen against these).
CONFIG_RMI4_CORE=y
CONFIG_RMI4_I2C=y
CONFIG_RMI4_F12=y

# The modem and the DSPs (remoteproc), the shared memory rmtfs serves, the
# mobile data path (IPA, rmnet); Wi-Fi (WCN3990 on the SoC) and its
# Bluetooth over UART; the sound card. Modules: they load firmware from the
# root file system, and built in they would ask for it once, from the
# initramfs, before the root is mounted.
CONFIG_QCOM_Q6V5_MSS=m
CONFIG_QCOM_Q6V5_PAS=m
CONFIG_QCOM_SYSMON=m
CONFIG_QCOM_RMTFS_MEM=y
CONFIG_QCOM_IPA=m
CONFIG_RMNET=m
CONFIG_ATH10K_SNOC=m
CONFIG_BT_HCIUART_QCA=y
CONFIG_SND_SOC_SDM845=m
CONFIG_SND_SOC_QDSP6_Q6VOICE=m

# Built in, what the phone always has and needs from the start of userspace,
# none of it with firmware: the IPC router that rmtfs, tqftpserv and the
# modem's QMI clients open from their start (as a module each socket asks
# for it), its transport to the DSPs and the protection domain mapper the
# DSPs ask when they start; the PMIC's RTC, so that the kernel sets the
# clock from it (hctosys) before userspace and phone-clock waits for no
# module; the fuel gauge (bq27411 on I2C), the PMI8998 charger and the ADC
# it reads, so that the battery is there when the Shell starts.
CONFIG_QRTR=y
CONFIG_QRTR_SMD=y
CONFIG_QCOM_PD_MAPPER=y
CONFIG_RTC_DRV_PM8XXX=y
CONFIG_BATTERY_BQ27XXX=y
CONFIG_BATTERY_BQ27XXX_I2C=y
CONFIG_CHARGER_QCOM_SMB2=y
CONFIG_QCOM_SPMI_RRADC=y
