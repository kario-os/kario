# The Qualcomm boards' kernel (machine kario-qcom) starts from arm64's
# defconfig; this adds what the platform needs and the modules SKUs use.

# The app sandbox (17-app-sandbox.md): Landlock, seccomp, namespaces,
# cgroup v2 controllers.
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_IPC_NS=y
CONFIG_UTS_NS=y
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_SCHED=y

# Per-app traffic and Wi-Fi only (nftables with connection marks).
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=m
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=m
CONFIG_NFT_REJECT=m

# The modules SKUs may use (24-sku-framework.md; tools/sku.py checks).
CONFIG_KEYBOARD_TCA8418=y
CONFIG_DRM_PANEL_SITRONIX_ST7701=m
