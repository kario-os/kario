# The emulator has no LEDs: a userspace LED (uleds) stands in for the
# board's notification LED, and the selftest watches it blink.
CONFIG_LEDS_USER=y
# The virt machine's power button: QEMU's system_powerdown raises a line of
# its PL061 GPIO controller, which its device tree gives gpio-keys as
# KEY_POWER. The selftest presses it from the monitor (qemu-selftest.sh).
CONFIG_GPIO_PL061=y
CONFIG_KEYBOARD_GPIO=y
# A battery and chargers to plug in and out (/sys/module/test_power/
# parameters) for charger mode's test (yocto/qemu-charger.sh), which loads
# it (modules-load=test_power); nothing else does, so the Shell's tests
# keep the emulator without a battery.
CONFIG_TEST_POWER=m
