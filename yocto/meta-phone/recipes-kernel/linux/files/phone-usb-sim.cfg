# One emulator is both ends of the cable: dummy_hcd is a USB device
# controller wired to a host controller, so the phone's gadget appears as a
# device on its own host side, which drives it as a computer would
# (cdc_ncm), and the selftest reaches file sharing through it.
CONFIG_USB_DUMMY_HCD=y
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDC_NCM=y
