# The phone as a USB device (hal/usbgadget): gadgets made through configfs,
# with a CDC-NCM network function the computer drives with its own class
# driver; USB keyboards and mice on the host side (HID).
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_NCM=y
# File transfer over MTP: a FunctionFS function whose descriptors the
# Shell writes and whose endpoints the sandboxed helper serves.
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
# USB-C: the port's data role and its partner (the port controller's
# driver, a board's, negotiates the role and Power Delivery).
CONFIG_TYPEC=y
CONFIG_USB_ROLE_SWITCH=y
