# System updates (R37): RAUC mounts bundles (squashfs on a loop device),
# checks verity-format bundles (dm-verity) and streams them over HTTP (nbd).
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_BLK_DEV_NBD=y
