# The VPN (Settings › VPN): WireGuard, which systemd-networkd sets up, and
# the policy routing of a full tunnel (a routing table of its own, chosen
# by the tunnel's firewall mark).
CONFIG_WIREGUARD=y
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y
CONFIG_IPV6_MULTIPLE_TABLES=y
# The device selftest's VPN server: a network namespace of its own behind a
# veth pair.
CONFIG_NET_NS=y
CONFIG_VETH=y
