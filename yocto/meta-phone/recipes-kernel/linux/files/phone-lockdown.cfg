# Lockdown (integrity) on every Kario kernel, as Nura's sdm845 configuration
# has it: only modules signed with a key the kernel was built with load, and
# /dev/mem, writable debugfs and kexec of unsigned kernels are refused.
# Modules are signed when installed with the build directory's key, which
# phone-kernel.inc puts at this path (yocto/ota-keys.sh makes it); the
# kernel's own autogenerated key would differ from one build of the same
# recipe to the next, and the shared sstate pairs one's kernel with
# another's modules.
CONFIG_MODULES=y
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA512=y
CONFIG_MODULE_SIG_KEY="certs/kario-modules.pem"
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y
# The level in /sys/kernel/security/lockdown, which module-check.sh and the
# phone's checks read; QEMU's configuration has no securityfs otherwise.
CONFIG_SECURITYFS=y
