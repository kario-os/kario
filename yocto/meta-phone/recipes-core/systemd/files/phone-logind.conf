# The Shell owns the phone's keys and its power policy (shell/keys.go,
# shell/sleep.go): a press of the power key turns the screen off or on, a
# long one opens the power menu, and the Shell decides when the whole phone
# suspends. logind's defaults would power the phone off at a press of the
# power key, suspend it when a magnetic cover closes over its Hall sensor
# (SW_LID), and act on the other keys behind the Shell's back.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
