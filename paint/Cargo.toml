[package]
name = "phone-paint"
version = "0.1.0"
edition = "2021"
description = "Our own pixel renderer for the renderer slot (phone.frame/1): no Slint, permissive dependencies only"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny-skia = "0.11"
# The same version tiny-skia uses: raster.rs asks it where tiny-skia chops curves.
tiny-skia-path = "0.11"
ab_glyph = "0.2"
ttf-parser = "0.25"
base64 = "0.22"
drm = "0.14"
evdev = "0.13"
libc = "0.2"
landlock = "0.4"
# The GPU path (gpu.rs): libEGL, libGLESv2 and libgbm are opened at run
# time, so the renderer starts and draws on the CPU where Mesa is missing.
khronos-egl = { version = "6", default-features = false, features = ["1_5", "dynamic"] }
glow = "0.18"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# make test's and CI's cargo test: the release build with the debug-only
# checks on (the dependencies' too), which the shipped renderer never runs.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
