[package]
name = "phone-paint"
version = "0.1.0"
edition = "2021"
description = "Our own pixel renderer for the renderer slot (phone.frame/1): no Slint, permissive dependencies only"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
ttf-parser = "0.25"
base64 = "0.22"
drm = "0.14"
evdev = "0.13"
libc = "0.2"
landlock = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
